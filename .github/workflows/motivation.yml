name: Send Daily Motivation

on:
  schedule:
    - cron: '0 1 * * *'  # UTC အချိန် ည ၁ နာရီ (UAE အချိန် မနက် ၅ နာရီ)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python motivation.py
